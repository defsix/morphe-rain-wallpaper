plugins {
    id 'com.android.application'
}

android {
    namespace 'app.morpherain.wallpaper'
    compileSdk 37

    defaultConfig {
        applicationId 'app.morpherain.wallpaper'
        minSdk 26
        targetSdk 37
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
